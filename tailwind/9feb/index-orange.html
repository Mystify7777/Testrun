<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Cart Page</title>
    <link rel="stylesheet" href="styles-orange.css">
</head>
<body>
    <nav>
        <div class="logo"><h1>Our Store</h1></div>
        <button class="cart-btn">View Cart</button>
    </nav>
    <div class="product-list-container list-container"></div>
    <div class="cart-list">
        <div class="cart-drawer-head">
            <h1>Your Cart</h1>
            <button class="close-button">X</button>
        </div>
        <div class="cart-list-con"></div>
        <div class="cart-total">
            <h2>Total: $<span id="total-price">0</span></h2>
        </div>
    </div>
    <script src="script-orange.js"></script>
</body>
</html>
