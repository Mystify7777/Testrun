<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Showcase</title>
  <link rel="stylesheet" href="vehicle.css">
</head>
<body>
  <!-- Navbar -->
  <nav id="navbar">
    <div class="container">
      <div class="logo">VehicleZone</div>
      <ul class="nav-links">
        <li><a href="#cars">Cars</a></li>
        <li><a href="#bikes">Bikes</a></li>
        <li><a href="#trucks">Trucks</a></li>
      </ul>
      <div class="profile-btn">
        <button id="profileButton">Profile</button>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header id="hero-banner">
    <div class="container hero-content">
      <div class="hero-text">
        <h1 id="hero-heading">Welcome to VehicleZone</h1>
        <p id="hero-subheading">Explore a wide range of vehicles across different categories.</p>
      </div>
      <div class="hero-image">
        <img src="hero-image-placeholder.jpg" alt="Hero Banner Image">
      </div>
    </div>
  </header>

  <!-- Product Grids -->
  <main id="product-section" class="container">
    <section id="cars">
      <h2>Cars</h2>
      <div class="product-grid" id="car-grid">
    
      </div>
    </section>

    <section id="bikes">
      <h2>Bikes</h2>
      <div class="product-grid" id="bike-grid">
    
      </div>
    </section>

    <section id="trucks">
      <h2>Trucks</h2>
      <div class="product-grid" id="truck-grid">
    
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <div class="container footer-content">
      <div class="footer-links">
        <a href="#">About Us</a>
        <a href="#">Contact</a>
        <a href="#">Privacy Policy</a>
      </div>
      <p>&copy; 2025 VehicleZone. All rights reserved.</p>
    </div>
  </footer>

  <script src="vehicle.js"></script>
</body>
</html>
