<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystify Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Mystify</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#featured">Featured</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section with Slider -->
    <section id="home" class="hero">
        <div class="slider">
            <div class="slide"> <img src="hero01.jpg" alt="Discover the Future of Tech"> <h2>Discover the Future of Tech</h2> </div>
            <div class="slide"> <img src="hero02.jpg" alt="Innovate Your Lifestyle"> <h2>Innovate Your Lifestyle</h2> </div>
            <div class="slide"> <img src="hero03.jpg" alt="Upgrade to the Best"> <h2>Upgrade to the Best</h2> </div>
        </div>
    </section>

    <!-- Featured Products Carousel -->
    <section id="featured" class="featured">
        <h2>Featured Products</h2>
        <div id="featured-carousel" class="product-carousel"></div>
    </section>

    <!-- More Products Grid -->
    <section id="products" class="products">
        <h2>More Products</h2>
        <div id="product-grid" class="product-grid"></div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Mystify Store. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
