<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate card</title>
    <link rel="stylesheet" href="styles3.css">
</head>
<body>
    <div class="container">
        <h1>Product Entry</h1>

        <div class="input-section">
            <input type="text" id="product-name" placeholder="Product Name">
            <input type="text" id="product-price" placeholder="Product Price">
            <input type="text" id="product-image" placeholder="Image URL">
            <textarea id="product-description" placeholder="Product Description"></textarea>
            <button id="add-product">Add Product</button>
        </div>

        <button id="toggle-cards">Show Cards</button>

        <section id="product-container" class="product-container hidden"></section>
    </div>

    <script src="script3.js"></script>
</body>
</html>
