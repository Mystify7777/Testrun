<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystify.Portfolio</title>
  
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Mystify</div>
        <ul class="nav-links">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <!-- Theme Toggle Button -->
        <button class="theme-toggle" id="theme-toggle"><i class="fas fa-adjust"></i></button>
    </nav>
    
    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-text">
            <h1>Welcome to My Portfolio</h1>
            <p>A passionate developer creating stunning web experiences.</p>
        </div>
        <div class="hero-image">
            <img src="placeholder.png" alt="Hero Image">
        </div>
    </header>
    
    <!-- About Section -->
    <section id="about">
        <h2>About Me</h2>
        <p>I am Aryan Kumar, a passionate web developer focused on creating intuitive user experiences.</p>
    </section>
    
    <!-- Skills Section -->
    <section id="skills">
        <h2>My Skills</h2>
        <div class="skills-container">
        <template id="skill-template">
            <div class="skill"></div>
        </template>
    </div>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>My Projects</h2>
        <div class="projects-container">
            <template id="project-template">
                <div class="project-card">
                    <img src="" alt="">
                    <h3></h3>
                    <a href="" target="_blank">View Project</a>
                </div>
            </template>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact-form">
        <h2>Contact Me</h2>
        <form action="mailto:aryankumar.55566@gmail.com" method="POST" enctype="text/plain">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="social-icons">
            <a href="#" class="fab fa-instagram"></a>
            <a href="#" class="fab fa-github"></a>
            <a href="#" class="fab fa-linkedin"></a>
            <a href="mailto:aryankumar.55566@gmail.com" class="fas fa-envelope"></a>
        </div>
    </footer>

    <!-- Include JS -->
    <script src="script.js"></script>
</body>
</html>
