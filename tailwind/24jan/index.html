<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A portfolio showcasing my coding journey, projects, and coding challenges.">
  <title>Portfolio Showcase</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-4">
    <h1 class="text-center text-3xl font-bold">Welcome to My Coding Journey</h1>
  </header>
  
  <main class="p-6">
    <!-- Hero Section -->
    <section id="hero" class="mb-10 p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-lg shadow-md">
      <h2 class="text-2xl font-semibold mb-2">Hello! I'm Aryan Kumar!</h2>
      <p class="text-lg">I'm a passionate learner working on web development, MERN stack, and Java projects.</p>
    </section>

    <!-- Project Cards -->
    <section id="projects" class="mb-10" aria-label="My Projects">
      <h2 class="text-xl font-semibold mb-4">My Projects</h2>
      <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Cards will be dynamically generated here -->
      </div>
    </section>

    <!-- Coding Challenge Tracker -->
    <section id="challenge" class="mb-10" aria-label="Coding Challenge Progress">
      <h2 class="text-xl font-semibold mb-4">Coding Challenge Progress</h2>
      <div id="challenge-progress" class="p-4 bg-white rounded-lg shadow-md">
        <!-- Progress will be dynamically updated -->
      </div>
    </section>
  </main>

  <footer class="bg-gray-800 text-white text-center p-4">
    <p>&copy; 2025 Mystify7777. Follow me on 
      <a href="https://github.com/Mystify7777" class="text-blue-400" target="_blank" rel="noopener noreferrer">GitHub</a>.
    </p>
  </footer>
</body>
</html>
