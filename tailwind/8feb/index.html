<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body{
            font-family: sans-serif;
        }

        .list-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .product-card {
            width: 300px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            flex-grow: 1;
            transition: transform 0.3s ease-in-out;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: contain;
        }

        .product-card p {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
            font-weight: 600;
        }

        .product-card p:last-of-type {
            font-size: 16px;
            color: #007bff;
            font-weight: bold;
        }

        section {
            padding: 20px;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        button:hover {
            background: #0056b3;
        }

        .hidden {
            display: none;
        }
    </style>

    <title>E-Commerce</title>
</head>

<body>
    <section>

    <h1>Products</h1>

    <div class="product-list-container list-container"></div>

</section>

<section>
    <button class="clg-btn">Show Cart</button>

    <div class="cart-list ">
        <h1>CART</h1>
<div class="list-container cart-list-con hidden"></div>
    </div>

</section>

     <script>
        let products = [
            {
                id: 1,
                name: "Micromax phone",
                image:
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXUVXERm3yWgAa9s5uAIG2et2PtD1mM-1n6g&s",
                price: 5999,
            },
            {
                id: 2,
                name: "Iphone phone",
                image:
                    "https://c8.alamy.com/comp/R06CKK/galati-romania-october-26-2018-apple-launch-the-new-smartphone-iphone-xs-and-iphone-xs-max-iphone-xs-max-on-white-background-R06CKK.jpg",
                price: 79999,
            },
            {
                id: 3,
                name: "Xomi phone",
                image:
                    "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcRWFzcSYfnHxhTMbHfuoLqPuRks4-Umy31_X0psKQXy8fOGPNshMGSOckiMsLbYFddeMKkVKtCj2dMqemdpgiQbarGUrgKIlXm69758X5FR",
                price: 12999,
            },
            {
                id: 4,
                name: "Redmi phone",
                image:
                    "https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcRo70Ctm4jZ4HfyQx1rlF4_mMSEmG-VDoOB4_ciJvEeoTc93iIN9zgwNKgQegqUjzEr-xe0RdtPcq57-L11dUtBO0A92SHk-aW8utObQBW5",
                price: 15999,
            },
            {
                id: 5,
                name: "Lava phone",
                image:
                    "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcRxqpSU5Bw6w7DaVrodwHVeUzZOtRy7XQHWzJFgs2O8VyHeNirYz_DTSdqwt8wEmIYLQ0AVFQC435mMevGNsTozuyow4iGs3M4k-U5KXodHuurmDZJx5hJ8Nw",
                price: 7999,
            },
            {
                id: 6,
                name: "Nokia phone",
                image:
                    "https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcRXz_yL8Ejjp8S5gpMoIZwVS26Tt2LlR4MPlhbbUQmoCg3cZ9jNi1U9ddU_Y-5BPI_TCHeTGDubr_gi_OaqIDOb5SUCZH4LCs5iktZEt6QBCx8T7FWCc57F",
                price: 10999,
            },
        ];

        let cart = [];

        // Displaying products section

        let temp = ``;

        for (let product of products) {
            temp += `<div class="product-card">
            <img src="${product.image}" alt="image" height:300 width:300>
            <p>${product.name}</p>
            <p>$ ${product.price}</p>
            <button class="button" id="${product.id}">Add to cart </button>
            </div>
            `;
        }
        document.querySelector(".product-list-container").innerHTML = temp;

        // Adding products to cart

        let all_button = document.querySelectorAll(".button");
        for (let button of all_button) {
            button.addEventListener("click", (event) => {
                let productId = event.target.getAttribute("id");
                let product = products.find(p => p.id == productId);
                let existing = cart.find(p => p.id == productId);
                if (existing) {
                    existing.quantity++;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }

                // updateCartItem();
            });
        }



        const cartDisp = document.querySelector(".clg-btn") 
        const cartCon = document.querySelector(".cart-list-con");
        cartDisp.addEventListener("click", showCartItem);

        //function to show cart items

        function showCartItem() {
            let temp = "";
            for (let item of cart) {
                temp += `
                <div class="product-card">
                    <img src="${item.image}" alt="image">
                    <p>${item.name}</p>
                    <p>$ ${item.price * item.quantity}</p>
                    <button class="decrease" data-id="${item.id}">-</button>
                    <span>${item.quantity}</span>
                    <button class="increase" data-id="${item.id}">+</button>
                </div>
            `;
        }
        cartCon.innerHTML = temp;


        
        // updateCartItem();
            
        cartCon.classList.toggle("hidden");
        cartDisp.innerHTML = cartCon.classList.contains("hidden") ? "Show  Cart" : "Hide Cart";
        }

    //function to show updated cart    

    function showUpdatedCart(){
        let temp = "";
        for (let item of cart) {
            temp += `
            <div class="product-card">
                <img src="${item.image}" alt="image">
                <p>${item.name}</p>
                <p>$ ${item.price * item.quantity}</p>
                <button class="decrease" data-id="${item.id}">-</button>
                <span>${item.quantity}</span>
                <button class="increase" data-id="${item.id}">+</button>
            </div>
        `;
        }
        cartCon.innerHTML = temp;
    }


    //function to update cart items
    function updateCartItem() {
    cartCon.addEventListener("click", event => {
        let productId = event.target.getAttribute("data-id");

        if (event.target.classList.contains("increase")) {
            let product = cart.find(p => p.id == productId);
            if (product) {
                product.quantity++;
            }
        }

        if (event.target.classList.contains("decrease")) {
            let item = cart.find(p => p.id == productId);
            if (item) {
                if (item.quantity > 1) {
                    item.quantity--;
                } else {
                    cart = cart.filter(p => p.id != productId);
                }
            }
        }

        showUpdatedCart(); 
    });
}

updateCartItem();


        </script> 

        <!-- <script src="script.js"></script> -->
    </body>

</html>
