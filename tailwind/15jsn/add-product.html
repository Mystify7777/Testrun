<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-lg shadow-lg max-w-2xl w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Add Product</h1>
    <form id="productForm" class="space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
        <input type="text" id="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
        <input type="number" id="price" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="compareAtPrice" class="block text-sm font-medium text-gray-700">Compare At Price</label>
        <input type="number" id="compareAtPrice" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="brand" class="block text-sm font-medium text-gray-700">Brand</label>
        <input type="text" id="brand" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="connectivity" class="block text-sm font-medium text-gray-700">Connectivity</label>
        <input type="text" id="connectivity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="energySaving" class="block text-sm font-medium text-gray-700">Energy Saving</label>
        <select id="energySaving" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <div>
        <label for="colors" class="block text-sm font-medium text-gray-700">Colors (comma separated)</label>
        <input type="text" id="colors" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="variants" class="block text-sm font-medium text-gray-700">Variants (comma separated)</label>
        <input type="text" id="variants" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="inStock" class="block text-sm font-medium text-gray-700">In Stock</label>
        <select id="inStock" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <div>
        <label for="reviews" class="block text-sm font-medium text-gray-700">Reviews</label>
        <input type="number" step="0.1" id="reviews" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg shadow hover:bg-blue-600 focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Add Product</button>
    </form>
    <p id="confirmation" class="mt-6 text-green-600 font-medium hidden">Product added successfully!</p>
    <div class="mt-6 text-center">
      <a href="display-products.html" class="text-blue-600 font-semibold hover:underline">View All Products</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
